name: Test on push

on: push

jobs:
  test-short:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'
    - name: Install
      run: pip install .
    - name: Run
      run: xunter --help
    - name: Run
      run: xunter --no-rc -c '2+2' ++depth-lt 5 ++output stdout
